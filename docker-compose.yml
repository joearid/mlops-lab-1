services:
  mlflow:
    build: ./mlflow
    ports:
    - 5000:5000
    volumes:
    - mlflow-data:/mlflow-data
  inference:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
    - mlflow
    volumes:
    - mlflow-data:/mlflow-data
  frontend:
    build: ./frontend
    ports:
    - 8501:8501
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
    - inference
  train:
    build: .
    profiles:
    - train
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
    - ./data:/app/data:ro
    depends_on:
    - mlflow
    command: python src/food11/train.py --dataset mini --epochs 2 --lr 0.0001 --batch-size
      32
volumes:
  mlflow-data: null
